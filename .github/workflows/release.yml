name: Release

# Publicerar en ny Elda-version:
#   1. Bygg Windows-paketen (NSIS + MSI)
#   2. Signera dem med updater-nyckeln
#   3. Skapa en GitHub Release med filerna
#   4. Publicera nedladdningsfiler + update.json till Cloudflare Pages
#
# Startas genom att pusha en tagg, t.ex.:  git tag v0.2.0 && git push origin v0.2.0
#
# Hemligheter som behövs (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY          – innehållet i ~/.tauri/elda.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD – lösenordet till nyckelfilen
#   CLOUDFLARE_API_TOKEN               – token med "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID              – kontots ID
#
# Variabler (Settings -> Secrets and variables -> Actions -> Variables):
#   ELDA_DOWNLOAD_BASE                 – t.ex. https://elda.pages.dev/downloads
#   VITE_SUPABASE_URL                  – projektets adress
#   VITE_SUPABASE_ANON_KEY             – publik anon-nyckel (ligger i klienten)
#
# VITE_SUPABASE_* behövs eftersom appen bakar in Supabase-adressen i bygget.
# Utan dem startar appen men kan inte logga in, så bygget stoppas hellre nedan.
#
# Webbplatsstegen hoppas över tills ELDA_DOWNLOAD_BASE och CLOUDFLARE_API_TOKEN
# är satta, så att appen kan publiceras innan hostingen är klar.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Minsta möjliga behörighet: skapa releaser. Inget mer.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      # secrets-contexten får inte användas direkt i ett step-if, därför
      # räknas villkoret ut en gång här.
      PUBLISH_SITE: ${{ vars.ELDA_DOWNLOAD_BASE != '' && secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installera node-beroenden
        run: npm ci

      - name: Kontrollera att Supabase-konfigurationen finns
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Appen bakar in adressen och anon-nyckeln vid bygget. Saknas de blir
          # den publicerade appen omöjlig att logga in i — avbryt hellre.
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL och VITE_SUPABASE_ANON_KEY måste vara satta som Actions-variabler."
            exit 1
          fi

      - name: Bygg och publicera Windows-paket
        # En manuell körning (workflow_dispatch) från en gren publicerar aldrig
        # en release – annars skapas ett tomt "releasemärke" med grenens namn.
        if: ${{ github.ref_type == 'tag' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Elda ${{ github.ref_name }}'
          # Texten hamnar både i GitHub-releasen och i webbplatsens
          # versionshistorik (site/build.mjs läser den). Håll den därför kort
          # och beskriv vad som faktiskt ändrats.
          releaseBody: |
            Inloggning
            - Appen byggs nu med rätt Supabase-adress och anon-nyckel, så inloggning fungerar i den installerade appen.
            - Inloggning sker med användarnamn och lösenord.
            - Nya konton får automatiskt ett användarnamn från förnamn och efternamn, till exempel ejentu01.
            - Nya konton har ett tillfälligt lösenord och måste skapa ett eget vid första inloggningen.
            - Bygget avbryts om Supabase-konfigurationen saknas, så en oanvändbar app inte publiceras igen.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis,msi

      - name: Kontrollera att appbygget fick Supabase-konfigurationen
        # Körs efter bygget, i samma jobb, och stoppar körningen om adressen
        # inte hamnade i det byggda gränssnittet. Då upptäcks en trasig
        # konfiguration innan någon hinner ladda ner en oanvändbar app.
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          vard="${VITE_SUPABASE_URL#https://}"
          vard="${vard%%/*}"
          if ! grep -rqF "$vard" dist/assets; then
            echo "::error::Supabase-adressen saknas i dist/assets – appen skulle inte kunna logga in."
            exit 1
          fi
          echo "✓ Supabase-adressen finns i det byggda gränssnittet"

      - name: Hämta signerade filer för webbplatsen
        if: ${{ github.ref_type == 'tag' && env.PUBLISH_SITE == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Rensa mappen först: annars ligger föregående versions filer kvar och
          # publiceras tillsammans med den nya versionen.
          rm -rf site/downloads
          mkdir -p site/downloads
          gh release download "${{ github.ref_name }}" \
            --dir site/downloads \
            --pattern '*.exe' --pattern '*.msi' --pattern '*.sig'
          ls -la site/downloads

      - name: Bygg webbplatsen
        if: ${{ github.ref_type == 'tag' && env.PUBLISH_SITE == 'true' }}
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELDA_DOWNLOAD_BASE: ${{ vars.ELDA_DOWNLOAD_BASE }}
        run: |
          npm install
          npm run build

      - name: Publicera till Cloudflare Pages
        if: ${{ github.ref_type == 'tag' && env.PUBLISH_SITE == 'true' }}
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name elda --branch main
