name: Release

# Publicerar en ny Elda-version:
#   1. Bygg Windows-paketen (NSIS + MSI)
#   2. Signera dem med updater-nyckeln
#   3. Skapa en GitHub Release med filerna
#   4. Publicera nedladdningsfiler + update.json till Cloudflare Pages
#
# Startas genom att pusha en tagg, t.ex.:  git tag v0.2.0 && git push origin v0.2.0
#
# Hemligheter som behövs (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY          – innehållet i ~/.tauri/elda.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD – lösenordet till nyckelfilen
#   CLOUDFLARE_API_TOKEN               – token med "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID              – kontots ID
#
# Variabel (Settings -> Secrets and variables -> Actions -> Variables):
#   ELDA_DOWNLOAD_BASE                 – t.ex. https://elda.pages.dev/downloads

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Minsta möjliga behörighet: skapa releaser. Inget mer.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installera node-beroenden
        run: npm ci

      - name: Bygg och publicera Windows-paket
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Elda ${{ github.ref_name }}'
          releaseBody: 'Se versionshistorik och installationsguide på nedladdningssidan.'
          releaseDraft: false
          prerelease: false
          args: --bundles nsis,msi

      - name: Hämta signerade filer för webbplatsen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/downloads
          gh release download "${{ github.ref_name }}" \
            --dir site/downloads \
            --pattern '*.exe' --pattern '*.msi' --pattern '*.sig'
          ls -la site/downloads

      - name: Bygg webbplatsen
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELDA_DOWNLOAD_BASE: ${{ vars.ELDA_DOWNLOAD_BASE }}
        run: |
          npm install
          npm run build

      - name: Publicera till Cloudflare Pages
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name elda --branch main
