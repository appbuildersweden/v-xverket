name: Release

# Publicerar en ny Elda-version:
#   1. Bygg Windows-paketen (NSIS + MSI)
#   2. Signera dem med updater-nyckeln
#   3. Skapa en GitHub Release med filerna
#   4. Publicera nedladdningsfiler + update.json till Cloudflare Pages
#
# Startas genom att pusha en tagg, t.ex.:  git tag v0.2.0 && git push origin v0.2.0
#
# Hemligheter som behövs (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY          – innehållet i ~/.tauri/elda.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD – lösenordet till nyckelfilen
#   CLOUDFLARE_API_TOKEN               – token med "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID              – kontots ID
#
# Variabler (Settings -> Secrets and variables -> Actions -> Variables):
#   ELDA_DOWNLOAD_BASE                 – t.ex. https://elda.pages.dev/downloads
#   VITE_SUPABASE_URL                  – projektets adress
#   VITE_SUPABASE_ANON_KEY             – publik anon-nyckel (ligger i klienten)
#   ELDA_SKOLA_URL                     – adressen till Elda-skola (frivillig)
#
# VITE_SUPABASE_* behövs eftersom appen bakar in Supabase-adressen i bygget.
# Utan dem startar appen men kan inte logga in, så bygget stoppas hellre nedan.
#
# Webbplatsstegen hoppas över tills ELDA_DOWNLOAD_BASE och CLOUDFLARE_API_TOKEN
# är satta, så att appen kan publiceras innan hostingen är klar.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Minsta möjliga behörighet: skapa releaser. Inget mer.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      # secrets-contexten får inte användas direkt i ett step-if, därför
      # räknas villkoret ut en gång här. Webbplatsen och uppdateringsmanifestet
      # publiceras när Cloudflare-token finns – det är manifestet som gör att
      # installerade appar hittar nya versioner, så det får inte hänga på
      # nedladdningsadressen.
      PUBLISH_SITE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installera node-beroenden
        # Appen som paketeras är den nya appen i src-new (den har
        # privatelevpanelen). Båda beroendeträden installeras: rotappen behövs
        # för Tauri-CLI:t, src-new för själva gränssnittet.
        run: |
          npm ci
          npm ci --prefix src-new

      - name: Kontrollera att Supabase-konfigurationen finns
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Appen bakar in adressen och anon-nyckeln vid bygget. Saknas de blir
          # den publicerade appen omöjlig att logga in i — avbryt hellre.
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL och VITE_SUPABASE_ANON_KEY måste vara satta som Actions-variabler."
            exit 1
          fi

      - name: Bygg och publicera Windows-paket
        # En manuell körning (workflow_dispatch) från en gren publicerar aldrig
        # en release – annars skapas ett tomt "releasemärke" med grenens namn.
        if: ${{ github.ref_type == 'tag' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Elda ${{ github.ref_name }}'
          # Texten hamnar både i GitHub-releasen och i webbplatsens
          # versionshistorik (site/build.mjs läser den). Håll den därför kort
          # och beskriv vad som faktiskt ändrats.
          releaseBody: |
            Shopen växer: fler teman, ramar och dekorationer
            - 19 nya föremål i shopen, 54 totalt i sju kategorier, fortfarande betalda med XP som redan tjänats in på uppgifter. Inga riktiga pengar, inga loot-lådor och ingen ny XP-väg.
            - Två nya UI-teman: *Ghostly Moonlight* (550 XP) och *Candy Crypt* (350 XP). De målar sin bakgrund med gradienter, så de behöver ingen bildfil och kan inte sluta fungera om en fil byts ut.
            - Fyra nya profilramar, fyra avatarer, fyra märken och fem dekorationer — alla med bilder som redan finns i paketet.
            - Butikens förhandsvisning visar nu även teman utan bild, och samlingen, köpen och utrustningen fungerar som förut.
            - Trädgården, uppgifterna, XP:n och övriga funktioner är oförändrade sedan 0.2.9.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis,msi

      - name: Bygg gränssnittet – kontrollkörning utan release
        # En manuell körning från en gren publicerar ingen release, men här
        # byggs gränssnittet ändå så att konfigurationskontrollen nedan får
        # något att titta på.
        if: ${{ github.ref_type != 'tag' }}
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Kontrollera att appbygget fick Supabase-konfigurationen
        # Körs efter bygget, i samma jobb, och stoppar körningen om adressen
        # inte hamnade i det byggda gränssnittet. Då upptäcks en trasig
        # konfiguration innan någon hinner ladda ner en oanvändbar app.
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          vard="${VITE_SUPABASE_URL#https://}"
          vard="${vard%%/*}"
          if ! grep -rqF "$vard" dist/assets; then
            echo "::error::Supabase-adressen saknas i dist/assets – appen skulle inte kunna logga in."
            exit 1
          fi
          echo "✓ Supabase-adressen finns i det byggda gränssnittet"

      - name: Hämta signerade filer för webbplatsen
        if: ${{ github.ref_type == 'tag' && env.PUBLISH_SITE == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Rensa mappen först: annars ligger föregående versions filer kvar och
          # publiceras tillsammans med den nya versionen.
          rm -rf site/downloads
          mkdir -p site/downloads
          gh release download "${{ github.ref_name }}" \
            --dir site/downloads \
            --pattern '*.exe' --pattern '*.msi' --pattern '*.sig'
          ls -la site/downloads

      - name: Bygg webbplatsen
        if: ${{ github.ref_type == 'tag' && env.PUBLISH_SITE == 'true' }}
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELDA_DOWNLOAD_BASE: ${{ vars.ELDA_DOWNLOAD_BASE }}
          # Basadress för update.json. Tom variabel faller tillbaka på appens
          # befintliga endpoint (elda-6a9.pages.dev).
          ELDA_UPDATER_BASE: ${{ vars.ELDA_UPDATER_BASE }}
          # Registreringsboten på hemsidan är enda publika vägen till ett konto.
          # Samma publika variabler som appbygget använder, så att bygget kan
          # skriva dist/config.json. Utan dem publiceras sidan utan serveradress
          # och registreringssidan visar "inte tillgänglig".
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # Adressen till Elda-skola. Tom variabel är tillåtet: då publiceras
          # sidan utan knapp och sektionen säger att plattformen inte går att
          # öppna ännu. Endast https-adresser godkänns av build.mjs.
          ELDA_SKOLA_URL: ${{ vars.ELDA_SKOLA_URL }}
        run: |
          npm install
          npm run build

      - name: Bygg Elda Skola under /skola
        # Elda Skola är en egen Vite-app. Den byggs med base /skola/ direkt in i
        # webbplatsens dist, så att samma Pages-deploy serverar båda. Samma
        # publika Supabase-variabler som appbygget använder.
        if: ${{ github.ref_type == 'tag' && env.PUBLISH_SITE == 'true' }}
        working-directory: elda-skola
        env:
          ELDA_SKOLA_BUILD: '1'
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npx tsc --noEmit
          npx vite build --outDir ../site/dist/skola --emptyOutDir

      - name: Publicera till Cloudflare Pages
        if: ${{ github.ref_type == 'tag' && env.PUBLISH_SITE == 'true' }}
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name elda --branch main

      - name: Kontrollera publicerat uppdateringsmanifest
        # Fångar det som annars bara märks i en installerad app: 404, fel
        # version, fel signatur eller en adress som serverar HTML.
        if: ${{ github.ref_type == 'tag' && env.PUBLISH_SITE == 'true' }}
        env:
          ELDA_UPDATER_BASE: ${{ vars.ELDA_UPDATER_BASE }}
        run: node scripts/kontrollera-uppdatering.mjs
